
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Mazairita · Realidad aumentada</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    #camera, #three {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #camera {
      object-fit: cover;
    }

    #three {
      pointer-events: none;
    }

    #scan { display: none; }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(150deg, #151515, #333);
      text-align: center;
    }

    #panel { max-width: 440px; }

    h1 { font-size: 28px; }

    p { line-height: 1.5; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #start {
      background: #fff;
      color: #111;
    }

    #status {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 10px;
      border-radius: 12px;
      background: #000b;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #choice {
      position: fixed;
      z-index: 6;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: none;
      justify-content: center;
      gap: 14px;
    }

    .choice {
      width: min(38vw, 180px);
      padding: 0;
      background: transparent;
    }

    .choice img {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 4px 12px #0008);
    }

    #media {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #000d;
    }

    #box {
      width: min(95vw, 720px);
      position: relative;
    }

    #response {
      display: block;
      width: 100%;
      max-height: 80vh;
      background: #000;
    }

    #close {
      position: absolute;
      right: 6px;
      top: 6px;
      z-index: 2;
      border-radius: 50%;
      padding: 8px 12px;
    }

    #soundControls {
      position: fixed;
      z-index: 7;
      bottom: calc(12px + env(safe-area-inset-bottom));
      left: 12px;
      display: none;
    }

    #soundButton {
      background: #fff;
      color: #111;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <video id="camera" playsinline muted></video>
  <canvas id="scan"></canvas>
  <canvas id="three"></canvas>

  <div id="intro">
    <div id="panel">
      <h1>Mazairita en realidad aumentada</h1>
      <p>
        Activá la cámara y apuntá al código QR.
        Cuando se detecte, aparecerá Mazairita y
        podrás conocer más sobre las especialidades.
      </p>
      <button id="start">Activar cámara</button>
      <p style="font-size:12px;color:#bbb">
        Requiere HTTPS y permiso para utilizar la cámara.
      </p>
    </div>
  </div>

  <div id="status">Esperando para iniciar...</div>

  <div id="choice">
    <button class="choice" id="yes" aria-label="Sí">
      <img alt="Sí"
        src="https://user.cdn.mywebar.com/860448/BOTON__SI__1789653740658.png?hash=b313e32bfd1c15eb7fa6eb33bcf47f70&_=1789655917369">
    </button>
    <button class="choice" id="no" aria-label="No">
      <img alt="No"
        src="https://user.cdn.mywebar.com/860448/BOTON__NO__1789653774074.png?hash=4735fdfd5f3cc99e73426affce64e2fc&_=1789655917369">
    </button>
  </div>

  <div id="soundControls">
    <button id="soundButton">▶ Activar sonido</button>
  </div>

  <audio id="sound" loop preload="none"></audio>

  <div id="media">
    <div id="box">
      <button id="close" aria-label="Cerrar video">✕</button>
      <video id="response" playsinline controls></video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // =================================================
    // CONFIGURACIÓN: CAMBIAR AQUÍ LAS DIRECCIONES
    // =================================================

    const MODEL =
      'https://user.cdn.mywebar.com/860448/MAZAIRITA_VERSION_FINAL_APARICION_Y_SALUDO_1791383762681.glb';

    const YES_VIDEO =
      'https://user.cdn.mywebar.com/860448/despedida_1789655906394.mp4';

    const NO_VIDEO =
      'https://user.cdn.mywebar.com/860448/MARCO_TEXTO_1790173626964.mp4';

    // Dejar vacío si no quieren música de fondo.
    // Ejemplos: './audio/ambiente.mp3' o './audio/ambiente.wav'
    const AUDIO_URL = '';

    // =================================================
    // ELEMENTOS
    // =================================================

    const camera = document.querySelector('#camera');
    const scanCanvas = document.querySelector('#scan');
    const scanCtx = scanCanvas.getContext(
      '2d', { willReadFrequently: true }
    );

    const intro = document.querySelector('#intro');
    const status = document.querySelector('#status');
    const choice = document.querySelector('#choice');
    const media = document.querySelector('#media');
    const response = document.querySelector('#response');
    const sound = document.querySelector('#sound');
    const soundControls = document.querySelector('#soundControls');
    const soundButton = document.querySelector('#soundButton');

    const startButton = document.querySelector('#start');

    // =================================================
    // THREE.JS
    // =================================================

    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector('#three'),
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();

    const camera3D = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.01,
      100
    );

    camera3D.position.set(0, 0, 5);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(2, 4, 5);
    scene.add(directionalLight);

    // Este grupo controla la posición del modelo respecto al QR.
    const root = new THREE.Group();
    root.visible = false;
    scene.add(root);

    let mixer = null;
    let modelReady = false;
    let cameraActive = false;
    let mediaOpen = false;
    let lastScan = 0;
    let lastSeen = 0;
    let animationNames = [];

    const clock = new THREE.Clock();

    // =================================================
    // CARGA DEL GLB Y SUS ANIMACIONES
    // =================================================

    async function loadModel() {
      status.textContent = 'Cargando modelo 3D...';

      try {
        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync(MODEL);

        const object = gltf.scene;

        if (!object) {
          throw new Error('El archivo no contiene una escena 3D.');
        }

        // Centrar y normalizar el tamaño del modelo.
        const bounds = new THREE.Box3().setFromObject(object);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());

        object.position.sub(center);

        const maxDimension = Math.max(size.x, size.y, size.z);

        if (maxDimension > 0) {
          object.scale.setScalar(1.8 / maxDimension);
        }

        root.add(object);

        // Verificar que existan animaciones en el GLB.
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(object);

          animationNames = gltf.animations.map(clip => clip.name);

          gltf.animations.forEach(clip => {
            const action = mixer.clipAction(clip);
            action.reset();
            action.enabled = true;
            action.setEffectiveWeight(1);
            action.setEffectiveTimeScale(1);
            action.play();
          });

          console.info(
            'Clips de animación encontrados:',
            gltf.animations.map(clip => ({
              nombre: clip.name,
              duración: clip.duration,
              pistas: clip.tracks.length
            }))
          );

          status.textContent =
            'Modelo cargado. Animaciones: ' + animationNames.join(', ');
        } else {
          console.warn(
            'El GLB cargó, pero no contiene clips de animación.'
          );

          status.textContent =
            'Modelo cargado, pero el GLB no contiene animaciones.';
        }

        modelReady = true;

      } catch (error) {
        console.error('Error cargando el GLB:', error);
        status.textContent =
          'Error al cargar el modelo. Revisá la consola del navegador.';
      }
    }

    // =================================================
    // RENDER Y ACTUALIZACIÓN DE LAS ANIMACIONES
    // =================================================

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      const delta = Math.min(clock.getDelta(), 0.05);

      if (mixer) {
        mixer.update(delta);
      }

      renderer.render(scene, camera3D);
    }

    renderLoop();

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);

    // =================================================
    // CÁMARA
    // =================================================

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      status.textContent = 'Solicitando permiso de cámara...';

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            'El navegador no permite acceder a la cámara. Usá HTTPS.'
          );
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        camera.srcObject = stream;
        await camera.play();

        intro.style.display = 'none';
        cameraActive = true;

        soundControls.style.display = AUDIO_URL ? 'block' : 'none';

        status.textContent = 'Cámara activa. Buscando el código QR...';

        requestAnimationFrame(scanLoop);

        loadModel();

      } catch (error) {
        console.error('Error de cámara:', error);

        status.textContent = 'No se pudo activar la cámara.';

        alert(
          'No se pudo activar la cámara. Revisá los permisos y HTTPS.\n' +
          (error.message || error.name || 'Error desconocido')
        );

        startButton.disabled = false;
      }
    });

    // =================================================
    // DETECCIÓN DEL QR
    // =================================================

    function scanLoop(timestamp) {
      if (!cameraActive) return;

      requestAnimationFrame(scanLoop);

      if (timestamp - lastScan < 80 || camera.readyState < 2) {
        return;
      }

      lastScan = timestamp;

      const width = camera.videoWidth;
      const height = camera.videoHeight;

      if (!width || !height || !window.jsQR) return;

      if (
        scanCanvas.width !== width ||
        scanCanvas.height !== height
      ) {
        scanCanvas.width = width;
        scanCanvas.height = height;
      }

      scanCtx.drawImage(camera, 0, 0, width, height);

      const imageData = scanCtx.getImageData(0, 0, width, height);

      const code = window.jsQR(
        imageData.data,
        width,
        height,
        { inversionAttempts: 'attemptBoth' }
      );

      if (code && code.location) {
        lastSeen = performance.now();

        const points = [
          code.location.topLeftCorner,
          code.location.topRightCorner,
          code.location.bottomRightCorner,
          code.location.bottomLeftCorner
        ];

        const centerX =
          points.reduce((sum, point) => sum + point.x, 0) / 4;

        const centerY =
          points.reduce((sum, point) => sum + point.y, 0) / 4;

        const edge = Math.hypot(
          points[1].x - points[0].x,
          points[1].y - points[0].y
        );

        // Proyección 2D aproximada. No es seguimiento AR espacial real.
        const nx = (centerX / width) * 2 - 1;
        const ny = 1 - (centerY / height) * 2;

        const distance = 3.4;
        const visibleHeight = 2 * Math.tan(
          THREE.MathUtils.degToRad(camera3D.fov) / 2
        ) * distance;

        root.position.set(
          nx * visibleHeight * camera3D.aspect / 2,
          ny * visibleHeight / 2,
          0
        );

        const relativeSize = edge / width;

        const modelScale = Math.max(
          0.35,
          Math.min(2.4, relativeSize * visibleHeight * 1.5)
        );

        root.scale.setScalar(modelScale);

        root.visible = modelReady && !mediaOpen;
        choice.style.display = mediaOpen ? 'none' : 'flex';

        if (!modelReady) {
          status.textContent = 'QR detectado. Esperando el modelo 3D...';
        } else {
          status.textContent = mixer
            ? '¡QR detectado! Mazairita está animada.'
            : 'QR detectado. Modelo cargado sin clips de animación.';
        }

      } else if (performance.now() - lastSeen > 220) {
        root.visible = false;
        choice.style.display = 'none';

        if (!mediaOpen) {
          status.textContent = 'Apuntá la cámara al código QR.';
        }
      }
    }

    // =================================================
    // VIDEOS MP4
    // =================================================

    function showVideo(url) {
      mediaOpen = true;
      root.visible = false;
      choice.style.display = 'none';

      response.pause();
      response.src = url;
      response.load();

      media.style.display = 'flex';

      response.play().catch(error => {
        console.warn('El video necesita interacción del usuario:', error);
        status.textContent = 'Tocá reproducir para iniciar el video.';
      });
    }

    function closeVideo() {
      response.pause();
      response.removeAttribute('src');
      response.load();

      media.style.display = 'none';
      mediaOpen = false;
    }

    document.querySelector('#yes').addEventListener('click', () => {
      showVideo(YES_VIDEO);
    });

    document.querySelector('#no').addEventListener('click', () => {
      showVideo(NO_VIDEO);
    });

    document.querySelector('#close').addEventListener('click', closeVideo);

    media.addEventListener('click', event => {
      if (event.target === media) closeVideo();
    });

    // =================================================
    // AUDIO MP3 / WAV
    // =================================================

    if (AUDIO_URL.trim() !== '') {
      sound.src = AUDIO_URL;
      sound.preload = 'auto';
      sound.volume = 0.7;
    }

    soundButton.addEventListener('click', async () => {
      try {
        if (sound.paused) {
          await sound.play();
          soundButton.textContent = '⏸ Pausar sonido';
        } else {
          sound.pause();
          soundButton.textContent = '▶ Activar sonido';
        }
      } catch (error) {
        console.error('Error reproduciendo audio:', error);
        status.textContent =
          'No se pudo reproducir el audio. Revisá la URL y el formato.';
      }
    });

    sound.addEventListener('ended', () => {
      soundButton.textContent = '▶ Activar sonido';
    });

    // =================================================
    // PAUSA AL SALIR DE LA PÁGINA
    // =================================================

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        camera.pause();
        sound.pause();
        response.pause();
      } else if (cameraActive) {
        camera.play().catch(console.warn);
      }
    });

  </script>
</body>
</html>
