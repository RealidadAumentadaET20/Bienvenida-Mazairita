<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Mazairita · 3er Año - Realidad Aumentada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}

/* Fondo de cámara y canvas 3D */
#camera,#three{position:fixed;inset:0;width:100%;height:100%}
#camera{object-fit:cover}
#three{pointer-events:none}

/* Pantalla de inicio de interacción (requerida por políticas de autoplay en navegadores móviles) */
#intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(150deg,#151515,#333);text-align:center}
#panel{max-width:440px}
h1{font-size:28px;margin:0 0 12px;color:#00e5ff}
p{line-height:1.5;color:#eee;font-size:15px}
button{border:0;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;transition:transform 0.2s}
button:active{transform:scale(0.95)}
#start{background:#00e5ff;color:#111;margin-top:12px}

/* Banner de estado */
#status{position:fixed;z-index:5;top:12px;left:12px;right:12px;padding:10px;text-align:center;border-radius:12px;background:rgba(0,0,0,0.7);font-size:14px;pointer-events:none;border:1px solid rgba(255,255,255,0.2)}

/* Botones SÍ y NO */
#choice{position:fixed;z-index:6;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:center;gap:20px}
.btn-action{min-width:110px;padding:14px 28px;font-size:18px;font-weight:bold;border-radius:50px;border:none;box-shadow:0 4px 15px rgba(0,0,0,0.5);cursor:pointer}
#yes{background:#00e676;color:#003311}
#no{background:#ff5252;color:#330000}

/* Elemento video HTML oculto para renderizado 3D */
#ar-video{display:none}
</style>
</head>
<body>

<!-- Video de fondo de la cámara del celular -->
<video id="camera" playsinline autoplay muted></video>

<!-- Canvas de Three.js -->
<canvas id="three"></canvas>

<!-- Pantalla inicial de bienvenida e interacción -->
<div id="intro">
  <div id="panel">
    <h1>Producción Multimedial · 3er Año</h1>
    <p>Te damos la bienvenida a la experiencia de Realidad Aumentada con Mazairita.</p>
    <button id="start">Iniciar experiencia</button>
  </div>
</div>

<div id="status">Iniciando experiencia...</div>

<!-- Botones de interacción superpuestos -->
<div id="choice">
  <button class="btn-action" id="yes">SÍ</button>
  <button class="btn-action" id="no">NO</button>
</div>

<!-- Elemento <video> oculto que provee los fotogramas para el plano 3D -->
<video id="ar-video" playsinline preload="auto" crossorigin="anonymous"></video>

<!-- Importmap para Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =========================================================================
   CONFIGURACIÓN Y RUTAS DE ASSETS
   ========================================================================= */
const ASSETS = {
  video: './assets/3ER AÑO.mp4',
  modelSaludo: './assets/MAZAIRITA-VERSION-FINAL-APARICIÓN Y SALUDO.glb',
  modelGiro2: './assets/MAZAIRITA-VERSION-FINAL-GIRO2.glb',
  docLink: 'https://docs.google.com/document/d/1g2UB1Tdas4mCC6SRX_setnILhVluAiEfka7CHQfyujU/edit?usp=sharing'
};

const cam = document.querySelector('#camera');
const intro = document.querySelector('#intro');
const startBtn = document.querySelector('#start');
const status = document.querySelector('#status');
const choice = document.querySelector('#choice');
const btnYes = document.querySelector('#yes');
const btnNo = document.querySelector('#no');
const videoElem = document.querySelector('#ar-video');

/* =========================================================================
   CONFIGURACIÓN DE ESCENA 3D (THREE.JS)
   ========================================================================= */
const renderer = new THREE.WebGLRenderer({
  canvas: document.querySelector('#three'),
  alpha: true,
  antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const cam3d = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 20);
cam3d.position.set(0, 0, 0);

// Luces
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(2, 4, 3);
scene.add(dirLight);

// Grupo general ubicado a 1 metro de distancia del teléfono
const mainGroup = new THREE.Group();
mainGroup.position.set(0, -0.2, -1.0); // Colocado a 1 metro hacia adelante
scene.add(mainGroup);

// Subgrupos para el Modelo 3D y el Plano de Video
const robotGroup = new THREE.Group();
robotGroup.position.set(-0.35, 0, 0); // Lado izquierdo
mainGroup.add(robotGroup);

const videoGroup = new THREE.Group();
videoGroup.position.set(0.35, 0, 0); // Lado derecho
mainGroup.add(videoGroup);

let videoTexture, videoMesh;
let activeMixer = null;
let modelSaludoScene = null;
let modelGiro2Scene = null;
let mixerSaludo = null;
let mixerGiro2 = null;

const clock = new THREE.Clock();
const loader = new GLTFLoader();

/* =========================================================================
   CARGA DE RECURSOS (VIDEOS Y MODELOS GLB)
   ========================================================================= */
function setupVideoMesh() {
  videoElem.src = ASSETS.video;
  videoTexture = new THREE.VideoTexture(videoElem);
  videoTexture.colorSpace = THREE.SRGBColorSpace;

  // Plano 3D para proyectar el video MP4
  const geometry = new THREE.PlaneGeometry(0.5, 0.88); // Proporción aproximada vertical
  const material = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide, transparent: true });
  videoMesh = new THREE.Mesh(geometry, material);
  videoGroup.add(videoMesh);
}

function loadModels() {
  // Carga Modelo 1: Aparición y Saludo
  loader.load(ASSETS.modelSaludo, (gltf) => {
    modelSaludoScene = gltf.scene;
    modelSaludoScene.scale.set(0.4, 0.4, 0.4);
    robotGroup.add(modelSaludoScene);

    if (gltf.animations && gltf.animations.length) {
      mixerSaludo = new THREE.AnimationMixer(modelSaludoScene);
      const action = mixerSaludo.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopOnce);
      action.clampWhenFinished = true;
      
      // Evento: Al terminar la animación de Saludo, pasar a la animación en bucle o segunda fase
      mixerSaludo.addEventListener('finished', () => {
        // Al terminar el saludo inicial, se mantiene la animación sin quitar los botones ni el video
        action.reset().play();
      });
    }
  }, undefined, (err) => console.error('Error cargando modelo Saludo:', err));

  // Carga Modelo 2: Giro 2
  loader.load(ASSETS.modelGiro2, (gltf) => {
    modelGiro2Scene = gltf.scene;
    modelGiro2Scene.scale.set(0.4, 0.4, 0.4);
    modelGiro2Scene.visible = false; // Oculto inicialmente
    robotGroup.add(modelGiro2Scene);

    if (gltf.animations && gltf.animations.length) {
      mixerGiro2 = new THREE.AnimationMixer(modelGiro2Scene);
      const action = mixerGiro2.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopOnce);
      action.clampWhenFinished = true;
    }
  }, undefined, (err) => console.error('Error cargando modelo Giro2:', err));
}

/* =========================================================================
   ACTIVACIÓN DE CÁMARA E INICIO DE EXPERIENCIA
   ========================================================================= */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    cam.srcObject = stream;
    await cam.play();
  } catch (err) {
    console.error('Error activando la cámara:', err);
    status.textContent = 'No se pudo activar la cámara.';
  }
}

// Escuchar orientación del celular (giroscopio para mantener fija la escena a 1 metro)
function enableGyroscope() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(permission => {
      if (permission === 'granted') {
        window.addEventListener('deviceorientation', onOrientationChange);
      }
    }).catch(() => {});
  } else {
    window.addEventListener('deviceorientation', onOrientationChange);
  }
}

function onOrientationChange(e) {
  const alphaRad = THREE.MathUtils.degToRad(e.alpha || 0);
  const betaRad = THREE.MathUtils.degToRad(e.beta || 0);
  cam3d.rotation.set(betaRad * 0.05, alphaRad * 0.05, 0, 'YXZ');
}

startBtn.addEventListener('click', async () => {
  intro.style.display = 'none';
  status.textContent = 'Cargando experiencia de 3er Año...';

  await startCamera();
  enableGyroscope();

  // Iniciar reproducción del video MP4 (se queda en el último frame al terminar)
  videoElem.play().catch(e => console.warn('Error al reproducir el video:', e));

  // Mostrar botones SÍ / NO y activar animaciones
  choice.style.display = 'flex';
  status.textContent = '3er Año · Producción Multimedial';

  if (mixerSaludo) {
    activeMixer = mixerSaludo;
    const action = mixerSaludo.clipAction(mixerSaludo._actions[0]._clip);
    action.reset().play();
  }
});

/* =========================================================================
   INTERACCIÓN CON BOTONES SÍ / NO
   ========================================================================= */

// Al presionar "SÍ"
btnYes.addEventListener('click', () => {
  switchAnimationToGiro2();
  
  // Enviar al documento de Google Drive indicado
  setTimeout(() => {
    window.location.href = ASSETS.docLink;
  }, 1200);
});

// Al presionar "NO"
btnNo.addEventListener('click', () => {
  switchAnimationToGiro2();

  // Desaparece el video MP4 y la experiencia finaliza
  videoGroup.visible = false;
  choice.style.display = 'none';
  status.textContent = '¡Gracias por visitar la muestra!';
});

function switchAnimationToGiro2() {
  if (modelSaludoScene) modelSaludoScene.visible = false;
  if (modelGiro2Scene) {
    modelGiro2Scene.visible = true;
    if (mixerGiro2) {
      activeMixer = mixerGiro2;
      const action = mixerGiro2.clipAction(mixerGiro2._actions[0]._clip);
      action.reset().play();
    }
  }
}

/* =========================================================================
   BUCLE DE RENDERIZADO
   ========================================================================= */
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (activeMixer) activeMixer.update(delta);

  // Mantener los elementos siempre orientados al usuario (Billboard)
  mainGroup.lookAt(cam3d.position);

  renderer.render(scene, cam3d);
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  cam3d.aspect = innerWidth / innerHeight;
  cam3d.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// Inicialización
setupVideoMesh();
loadModels();
animate();

</script>
</body>
</html>
