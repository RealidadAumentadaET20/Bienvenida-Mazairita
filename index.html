<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Mazairita · Realidad aumentada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#1b1b1b,#3a3a3a)}
body.xr{background:transparent}
#cam,#gl{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;display:none}
body.camon #cam{display:block}
body.xr #cam{display:none}
#gl{touch-action:none}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui button,#start{pointer-events:auto}
#ui button{border:0;cursor:pointer;font-family:inherit;font-weight:700}

/* Pantalla de inicio */
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(150deg,#151515,#333);z-index:20}
#panel{max-width:440px}
h1{font-size:28px;margin:0 0 12px}
p{line-height:1.5;color:#eee;margin:0 0 14px}
.main{display:block;width:100%;margin:10px 0;padding:15px 20px;border-radius:14px;font-size:17px;background:#fff;color:#111}
.second{display:block;width:100%;margin:10px 0;padding:13px 20px;border-radius:14px;font-size:15px;background:#fff2;color:#fff;border:1px solid #fff5!important}
.small{font-size:12px;color:#bbb}

/* Mensajes y barras */
#hint{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;padding:10px 12px;border-radius:12px;background:#000a;text-align:center;font-size:14px;display:none}
#topbar{position:absolute;top:calc(64px + env(safe-area-inset-top));right:12px;display:none;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:#000a;color:#fff;font-size:13px}

#question,#endbar{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;gap:12px;padding:0 16px}
#qtext{margin:0;padding:10px 16px;border-radius:14px;background:#000b;font-size:18px;text-align:center;font-weight:600}
.row{display:flex;gap:16px;justify-content:center;width:100%}
.big{flex:1;max-width:170px;padding:18px 10px;border-radius:18px;font-size:22px;color:#fff;box-shadow:0 6px 18px #0007}
.yes{background:#1faa59}.no{background:#d9433a}
#btnAgain{padding:14px 24px;border-radius:14px;font-size:16px;background:#fff;color:#111}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="ui">
  <div id="start">
    <div id="panel">
      <h1>Conocé a Mazairita</h1>
      <p>Tu guía por la especialidad de Producción Multimedial. Mazairita aparecerá frente a vos, en tu espacio. No hace falta ningún código QR.</p>
      <button id="btnXR" class="main" style="display:none">Iniciar realidad aumentada</button>
      <button id="btnCam" class="second">Usar modo cámara</button>
      <p class="small">Requiere HTTPS, permiso de cámara y sonido activado. Se recomienda usar auriculares o subir el volumen.</p>
    </div>
  </div>

  <div id="hint"></div>
  <div id="topbar">
    <button id="btnReplace" class="chip">Reubicar</button>
    <button id="btnExit" class="chip">Salir</button>
  </div>

  <div id="question">
    <p id="qtext"></p>
    <div class="row">
      <button id="yes" class="big yes">Sí</button>
      <button id="no" class="big no">No</button>
    </div>
  </div>

  <div id="endbar"><button id="btnAgain">Volver a empezar</button></div>
</div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">

  }
}
</script>
