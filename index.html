<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mazairita · AR QR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#ui{position:fixed;z-index:10;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
header{padding:18px;text-align:center;background:linear-gradient(#000b,transparent)}
header b{font-size:18px}
#status{margin:auto auto 22px;padding:12px 18px;border-radius:999px;background:#000b;color:#fff;font-size:14px;text-align:center}
#start{pointer-events:auto;border:0;border-radius:16px;padding:15px 28px;font-size:17px;font-weight:800}
#startBox{position:fixed;z-index:20;inset:0;background:#111;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
#startBox .card{max-width:430px}
#startBox p{line-height:1.5;opacity:.85}
#debug{display:none}
</style>
</head>
<body>
<video id="camera" playsinline muted></video>
<canvas id="arCanvas"></canvas>

<div id="startBox">
  <div class="card">
    <h1>Experiencia AR</h1>
    <p>Permite el acceso a la cámara y apunta al <b>código QR</b>. La experiencia aparecerá encima del QR y desaparecerá al perderlo.</p>
    <button id="start">ACTIVAR CÁMARA</button>
  </div>
</div>

<div id="ui">
  <header><b>MAZAIRITA · REALIDAD AUMENTADA</b></header>
  <div id="status">Apunta al código QR</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const video=document.querySelector('#camera');
const canvas=document.querySelector('#arCanvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const startBox=document.querySelector('#startBox');
const start=document.querySelector('#start');
const status=document.querySelector('#status');

const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0,0);

const scene=new THREE.Scene();
const camera3D=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);
const root=new THREE.Group();
scene.add(root);

scene.add(new THREE.HemisphereLight(0xffffff,0x666666,2.2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(2,4,3); scene.add(light);

const loader=new GLTFLoader();
let model=null;
const MODEL='https://user.cdn.mywebar.com/860448/MAZAIRITA_VERSION_FINAL_ESPERA__1__1790860025701.glb';
loader.load(MODEL,g=>{
  model=g.scene;
  model.scale.setScalar(1.65);
  model.position.set(0,0,0);
  root.add(model);
},undefined,e=>console.error(e));

let stream=null, lastSeen=0, raf=0;
let w=0,h=0;

function resize(){
  w=innerWidth;h=innerHeight;
  canvas.width=Math.round(w*devicePixelRatio);
  canvas.height=Math.round(h*devicePixelRatio);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  renderer.setSize(w,h,false);
  camera3D.aspect=w/h;camera3D.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

async function startCamera(){
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
    audio:false
  });
  video.srcObject=stream;
  await video.play();
  startBox.style.display='none';
  scan();
}

function qrCenterAndSize(q){
  const p=q.location;
  const xs=[p.topLeftCorner.x,p.topRightCorner.x,p.bottomRightCorner.x,p.bottomLeftCorner.x];
  const ys=[p.topLeftCorner.y,p.topRightCorner.y,p.bottomRightCorner.y,p.bottomLeftCorner.y];
  return {
    x:xs.reduce((a,b)=>a+b,0)/4,
    y:ys.reduce((a,b)=>a+b,0)/4,
    size:(Math.hypot(p.topRightCorner.x-p.topLeftCorner.x,p.topRightCorner.y-p.topLeftCorner.y)+
          Math.hypot(p.bottomRightCorner.x-p.bottomLeftCorner.x,p.bottomRightCorner.y-p.bottomLeftCorner.y))/2
  };
}

/*
  El QR se usa como marcador visual:
  - jsQR detecta sus cuatro esquinas.
  - El centro/tamaño del QR determinan el anclaje del contenido.
  - Si deja de detectarse durante ~180 ms, se oculta.
  Esto hace que el contenido sólo exista mientras el QR está siendo visto.
*/
function updateAnchor(q){
  const c=qrCenterAndSize(q);
  const sx=innerWidth/video.videoWidth;
  const sy=innerHeight/video.videoHeight;
  const x=c.x*sx-innerWidth/2;
  const y=c.y*sy-innerHeight/2;
  const s=Math.max(.01,c.size/Math.max(video.videoWidth,video.videoHeight)*3.8);

  root.position.set(x/300,-y/300,0);
  root.scale.setScalar(s*2.2);
  root.rotation.z=0;
  root.visible=true;
  status.textContent='QR detectado · experiencia activa';
}

function scan(){
  if(video.readyState>=2 && video.videoWidth){
    const max=720;
    const scale=Math.min(1,max/video.videoWidth);
    const sw=Math.round(video.videoWidth*scale);
    const sh=Math.round(video.videoHeight*scale);
    canvas.__scan=canvas.__scan||document.createElement('canvas');
    const sc=canvas.__scan;
    sc.width=sw;sc.height=sh;
    const sctx=sc.getContext('2d',{willReadFrequently:true});
    sctx.drawImage(video,0,0,sw,sh);
    const image=sctx.getImageData(0,0,sw,sh);
    const qr=window.jsQR(image.data,image.width,image.height,{inversionAttempts:'attemptBoth'});
    if(qr){
      // Convert detector coordinates back to source-video coordinates.
      const k=1/scale;
      for(const key of ['topLeftCorner','topRightCorner','bottomRightCorner','bottomLeftCorner']){
        qr.location[key].x*=k; qr.location[key].y*=k;
      }
      lastSeen=performance.now();
      updateAnchor(qr);
    }
  }
  if(performance.now()-lastSeen>180){
    root.visible=false;
    status.textContent='Apunta al código QR';
  }
  renderer.render(scene,camera3D);
  raf=requestAnimationFrame(scan);
}

start.addEventListener('click',()=>{
  startCamera().catch(err=>{
    console.error(err);
    status.textContent='No se pudo acceder a la cámara';
  });
});
</script>
</body>
</html>
